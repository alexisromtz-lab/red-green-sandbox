[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redgreen-sandbox"
version = "1.0.0"
description = "Certifica que un parche resuelve un issue: RC != 0 -> RC == 0 sin mutar el examen."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Platino Labs" }]
keywords = ["testing", "red-green", "sandbox", "ci", "patch-verification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]
dependencies = []

# HUELLA-CENSO-PYTEST-PLANTILLA-DECLARACIONES-20261020
# pytest es del APARATO (collector + junitxml), no del runtime: el runner lo
# instalaba a ciegas. `pip install -e .` no instala extras: la ruta no cambia.
[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
redgreen-sandbox = "sandbox:main"

[tool.setuptools]
py-modules = ["sandbox"]
